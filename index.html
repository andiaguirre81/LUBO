<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e98b3d">
<title>Lubo – Praxisbegleiter</title>
<style>
:root{--orange:#e98b3d;--violet:#5750a2;--green:#56715a;--sage:#e4ebe1;--cream:#fbf6ed;--ink:#26332b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--orange);color:#fff;padding:18px;display:flex;align-items:center;gap:14px}
.home{width:58px;height:58px;border:0;border-radius:19px;background:var(--green);color:#fff;font-size:24px;font-weight:800}
header h1{margin:2px 0;font-size:1.55rem} header small{font-size:.92rem;opacity:.92}
nav{background:#fff;padding:12px;display:flex;justify-content:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0001}
nav button{border:0;border-radius:15px;padding:11px 18px;font-weight:800;font-size:1rem;background:#eee}
nav button.active{background:var(--violet);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 3px 14px #0000000c}
.hero{background:linear-gradient(135deg,var(--sage),#fff)}
.pill,.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:.82rem}
.pill{background:var(--orange);color:#fff} .tag{background:var(--sage);margin:4px 4px 0 0}
.phase{color:var(--green);margin:23px 0 10px}
.lesson{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.lesson:last-child{border-bottom:0}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sage);font-weight:900}
.open,.primary{border:0;border-radius:12px;padding:10px 13px;background:var(--green);color:#fff;font-weight:800}
.muted{font-size:.88rem;color:#738077}
.material{padding:8px 0;border-bottom:1px solid #eee}
.step{position:relative;background:#fafafa;border-radius:14px;padding:14px 14px 14px 52px;margin:10px 0}
.step::before{content:attr(data-step);position:absolute;left:13px;top:12px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:900}
.step p{margin:6px 0 8px} .mini{background:#edf2ed;border-radius:9px;padding:7px 9px;font-size:.86rem}
.back{border:0;border-radius:12px;padding:9px 12px;background:var(--sage);font-weight:800;margin-bottom:12px}
.note{border-left:5px solid #ddb85f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:600px){header{padding:15px}header h1{font-size:1.4rem}main{padding:13px}.lesson{grid-template-columns:38px 1fr}.lesson .open{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header>
<button id="homeBtn" class="home" aria-label="Startseite">⌂?</button>
<div><small>Interne Arbeitshilfe · Vorschulprogramm</small><h1>Lubo – Praxisbegleiter</h1></div>
</header>
<nav>
<button id="overviewBtn" class="active">Übersicht</button>
<button id="materialsBtn">Material 1–3</button>
</nav>
<main id="app"></main>

<script type="application/json" id="lesson-data">[{"n":1,"title":"Hier kommt Lubo aus dem All!","goals":["Förderprogramm kennenlernen","Gruppenregeln"],"materials":["Handpuppe „Lubo“","Bild von Lubo im Raumschiff","Kleiner Ball","Regelkarten und kleiner Beutel o. Ä.","Lebhaftes Lied und Abspielgerät","Schönes Tuch für die Kreismitte"],"prep":["Umgang mit der Handpuppe kurz ausprobieren.","Stuhlkreis und Kreismitte vorbereiten.","Lubo zunächst außerhalb des Raums aufbewahren."],"steps":[["Begrüßung & Lubo vorstellen","Lubo als Besucher aus dem All einführen. Er möchte von den Kindern lernen, wie man auf der Erde gut miteinander umgeht.","Handpuppe, Lubo-Bild"],["Namensspiel mit Ball","Ball im Kreis zurollen, Blickkontakt aufnehmen und den eigenen Namen sagen. In einer zweiten Runde kann der Name des Kindes genannt werden, zu dem der Ball rollt.","Ball"],["Gruppenregeln","Regelkarten gemeinsam anschauen, die dargestellten Regeln mit den Kindern formulieren und anschließend sichtbar im Raum lassen.","Regelkarten"],["Kooperationsspiel „Eisscholle“","Die Gruppe rückt auf einer kleiner werdenden Fläche zusammen. Gemeinsam Lösungen finden, damit alle Platz haben.","Spielfläche / Eisscholle"],["Abschlussritual","Gemeinsam aufstehen, Hände zur Mitte und die Stunde mit dem vereinbarten Ritual beenden.","–"]]},{"n":2,"title":"Zusammen sind wir eine Gruppe!","goals":["Gruppengefühl stärken","Sternenrunde einführen"],"materials":["Handpuppe „Lubo“","Regelkarten","Tuch für die Kreismitte","Musik und Abspielgerät","Sternenaufkleber","Farbiges Tonpapier","Dunkelblauer Fotokarton","Fotogerät"],"prep":["Fotokarton und Bastelmaterial bereitlegen.","Eigenes Handmuster als Beispiel vorbereiten.","Raum und Kreismitte gestalten; Gruppenregeln sichtbar aufhängen.","Lubo-Lied bereithalten."],"steps":[["Begrüßung","Lubo-Lied und kurze Wiederholung der Gruppenregeln. Gemeinsam einen Gruppennamen festlegen.","Lubo, Lied, Regelkarten"],["Namensspiel „Mein rechter, rechter Platz ist frei“","Im Stuhlkreis bleibt ein Platz frei. Das Kind daneben wünscht ein anderes Kind auf den freien Platz; Namen werden wiederholt.","Stuhlkreis"],["Gruppenbild gestalten","Jedes Kind gestaltet einen Handumriss. Die Hände werden gemeinsam als Gruppenbild angeordnet und mit Namen versehen.","Tonpapier, Fotokarton, Bastelmaterial"],["Sternenrunde","Lubo hebt bei jedem Kind konkret etwas Positives aus der Stunde hervor. Das Kind erhält einen Stern.","Sternenaufkleber"],["Gruppenfoto","Ein Foto der Gruppe für das Gruppenbild aufnehmen.","Fotogerät"],["Abschlussritual","Gemeinsamer Abschluss wie in Stunde 1.","–"]]},{"n":3,"title":"Lubo und die Kinder machen einen Wetterbericht","goals":["Stimmungsbarometer einführen","Gefühle erkennen und benennen"],"materials":["Handpuppe „Lubo“","Emotionsbilder von Lubo","Emotionsbilder von Kindern","Fragezeichen-Karte","Bilder oder Fotos: Sonne, Regen, Gewitter und Nebel","Tücher: gelb, blau, weiß und grau","Bild „Lubo mit Herz“","Sternenaufkleber"],"prep":["Vier Wetterecken vorbereiten: Sonne, Regen, Gewitter/Sturm und Nebel.","Passende Tücher, Wetterbilder und Emotionsbilder bereitlegen."],"steps":[["Begrüßung","Lubo-Lied; bei Bedarf die Gruppenregeln kurz wiederholen.","Lubo, Lied"],["„Markt der Gefühle“","Kinder bewegen sich durch den Raum und stellen verschiedene Gefühlslagen körperlich dar, z. B. fröhlich, traurig oder müde, selbstbewusst, ängstlich oder wütend.","Freie Bewegungsfläche"],["Gefühlswetter einführen","Gemeinsam Gefühle mit Wetterlagen vergleichen und zuordnen. Unterschiedliche Zuordnungen sind ausdrücklich möglich.","Emotionsbilder, Wetterbilder, Tücher"],["Eigener Wetterbericht","Jedes Kind überlegt: „Welches Wetter ist gerade in mir?“ und stellt sich in die passende Wetterecke. Wer möchte, erklärt kurz warum.","Vorbereitete Wetterecken"],["Sternenrunde","Lubo benennt bei jedem Kind etwas Positives aus der Stunde und vergibt einen Stern.","Sternenaufkleber"],["Abschlussritual","Gemeinsamer Abschluss wie in Stunde 1.","–"]],"note":"Beim Gefühlswetter gibt es kein „richtig“ oder „falsch“. Die Kinder entscheiden selbst, welches Wetter zu ihrer momentanen Stimmung passt."},{"n":4,"title":"Wir lernen uns besser kennen"},{"n":5,"title":"Das kann ich gut!"},{"n":6,"title":"Auf dem nebligen See"},{"n":7,"title":"Wer ist alles in der Sternengruppe?"},{"n":8,"title":"Wir sind die Detektive der Sternengruppe"},{"n":9,"title":"Wir sind eine Gruppe und halten zusammen!"},{"n":10,"title":"Mein Körper verrät mir, wie es mir geht!"},{"n":11,"title":"Lubo freut sich über seine neuen Freunde"},{"n":12,"title":"Lubo hat Heimweh"},{"n":13,"title":"Lubo hat Ärger bekommen"},{"n":14,"title":"Lubo hat Angst"},{"n":15,"title":"Lubos mutige Freunde"},{"n":16,"title":"Lubo und die Gefühlsdetektive"},{"n":17,"title":"Wie würdest du dich fühlen?"},{"n":18,"title":"Eine Busfahrt mit viel Gefühl"},{"n":19,"title":"Die Sternengruppe wird gebraucht"},{"n":20,"title":"Ich fühle mich wohl!"},{"n":21,"title":"Lubos Raumschiff ist weg!"},{"n":22,"title":"Lubo darf nicht mitspielen"},{"n":23,"title":"Lubo wird gehänselt"},{"n":24,"title":"Lubo kann ganz ruhig bleiben"},{"n":25,"title":"Zusammen können wir vieles lösen"},{"n":26,"title":"Lubo verliert ein Spiel"},{"n":27,"title":"Lubo lernt, mit Enttäuschungen umzugehen"},{"n":28,"title":"Wir können gut zusammenarbeiten!"},{"n":29,"title":"Lubo löst einen Streit"},{"n":30,"title":"Sternenfahrt"},{"n":31,"title":"Lubo möchte gerne mitmachen!"},{"n":32,"title":"Lubo hat gelernt, wie man gut miteinander umgeht"},{"n":33,"title":"Lubos neues Raumschiff"},{"n":34,"title":"Auf Wiedersehen!"}]</script>
<script>
const lessons = JSON.parse(document.getElementById("lesson-data").textContent);
const app = document.getElementById("app");
const overviewBtn = document.getElementById("overviewBtn");
const materialsBtn = document.getElementById("materialsBtn");
const homeBtn = document.getElementById("homeBtn");

function nav(which) {
  overviewBtn.classList.toggle("active", which === "overview");
  materialsBtn.classList.toggle("active", which === "materials");
}

function home() {
  nav("overview");
  let html = `
    <section class="card hero">
      <span class="pill">Praxis-Spickzettel</span>
      <h2>Was brauche ich? Was mache ich?</h2>
      <p>Direkte Arbeitshilfe für die Durchführung – ohne Eingaben oder Speicherung.</p>
    </section>
    <h3 class="phase">Einführung · Rituale & Gruppengefühl</h3>
    <section class="card">`;
  lessons.forEach(l => {
    if (l.n === 4) {
      html += `</section><h3 class="phase">Weitere Stunden</h3><section class="card">`;
    }
    html += `<div class="lesson">
      <div class="num">${l.n}</div>
      <div><b>${l.title}</b>
        ${l.goals ? `<div>${l.goals.map(g => `<span class="tag">${g}</span>`).join("")}</div>` : `<div class="muted">noch nicht eingepflegt</div>`}
      </div>
      ${l.n <= 3 ? `<button class="open" data-open="${l.n}">Öffnen</button>` : ""}
    </div>`;
  });
  html += `</section>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => lesson(Number(b.dataset.open))));
}

function lesson(n) {
  nav("overview");
  const l = lessons.find(x => x.n === n);
  if (!l || !l.materials) return home();
  app.innerHTML = `
    <button class="back" id="backBtn">← Übersicht</button>
    <section class="card hero">
      <span class="pill">Stunde ${l.n}</span>
      <h2>${l.title}</h2>
      <div>${l.goals.map(g => `<span class="tag">${g}</span>`).join("")}</div>
    </section>
    <section class="card"><h3>🧰 Das brauche ich</h3>${l.materials.map(x => `<div class="material">• ${x}</div>`).join("")}</section>
    <section class="card"><h3>🛠️ Vorher vorbereiten</h3>${l.prep.map(x => `<div class="material">• ${x}</div>`).join("")}</section>
    <section class="card"><h3>▶️ So geht’s</h3>
      ${l.steps.map((s,i) => `<div class="step" data-step="${i+1}"><b>${s[0]}</b><p>${s[1]}</p><div class="mini"><b>Material:</b> ${s[2]}</div></div>`).join("")}
    </section>
    ${l.note ? `<section class="card note"><b>Praxishinweis</b><p>${l.note}</p></section>` : ""}
  `;
  document.getElementById("backBtn").addEventListener("click", home);
}

function materials() {
  nav("materials");
  const first = lessons.slice(0,3);
  app.innerHTML = `
    <section class="card hero"><span class="pill">Vorbereitung</span><h2>Materialübersicht · Stunden 1–3</h2></section>
    <div class="grid">
    ${first.map(l => `<section class="card"><h3>${l.n}. ${l.title}</h3>${l.materials.map(x => `<div class="material">• ${x}</div>`).join("")}<button class="primary" data-mat="${l.n}" style="margin-top:12px">Stunde öffnen</button></section>`).join("")}
    </div>`;
  app.querySelectorAll("[data-mat]").forEach(b => b.addEventListener("click", () => lesson(Number(b.dataset.mat))));
}

overviewBtn.addEventListener("click", home);
materialsBtn.addEventListener("click", materials);
homeBtn.addEventListener("click", home);
home();
</script>
</body>
</html>
