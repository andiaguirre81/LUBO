<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e98b3d">
<title>Lubo – Praxisbegleiter</title>
<style>
:root{--orange:#e98b3d;--violet:#5750a2;--green:#56715a;--sage:#e4ebe1;--cream:#fbf6ed;--ink:#26332b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--orange);color:#fff;padding:18px;display:flex;align-items:center;gap:14px}
.home{width:58px;height:58px;border:0;border-radius:19px;background:var(--green);color:#fff;font-size:24px;font-weight:800}
header h1{margin:2px 0;font-size:1.55rem} header small{font-size:.92rem;opacity:.92}
nav{background:#fff;padding:12px;display:flex;justify-content:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0001}
nav button{border:0;border-radius:15px;padding:11px 18px;font-weight:800;font-size:1rem;background:#eee}
nav button.active{background:var(--violet);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 3px 14px #0000000c}
.hero{background:linear-gradient(135deg,var(--sage),#fff)}
.pill,.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:.82rem}
.pill{background:var(--orange);color:#fff} .tag{background:var(--sage);margin:4px 4px 0 0}
.phase{color:var(--green);margin:23px 0 10px}
.lesson{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.lesson:last-child{border-bottom:0}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sage);font-weight:900}
.open,.primary{border:0;border-radius:12px;padding:10px 13px;background:var(--green);color:#fff;font-weight:800}
.muted{font-size:.88rem;color:#738077}
.material{padding:8px 0;border-bottom:1px solid #eee}
.step{position:relative;background:#fafafa;border-radius:14px;padding:14px 14px 14px 52px;margin:10px 0}
.step::before{content:attr(data-step);position:absolute;left:13px;top:12px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:900}
.step p{margin:6px 0 8px} .mini{background:#edf2ed;border-radius:9px;padding:7px 9px;font-size:.86rem}
.back{border:0;border-radius:12px;padding:9px 12px;background:var(--sage);font-weight:800;margin-bottom:12px}
.note{border-left:5px solid #ddb85f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:600px){header{padding:15px}header h1{font-size:1.4rem}main{padding:13px}.lesson{grid-template-columns:38px 1fr}.lesson .open{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header>
<button id="homeBtn" class="home" aria-label="Startseite">⌂?</button>
<div><small>Interne Arbeitshilfe · Vorschulprogramm</small><h1>Lubo – Praxisbegleiter</h1></div>
</header>
<nav>
<button id="overviewBtn" class="active">Übersicht</button>
<button id="materialsBtn">Material 1–9</button>
</nav>
<main id="app"></main>

<script>
const lessons = JSON.parse(document.getElementById("lesson-data").textContent);
const app = document.getElementById("app");
const overviewBtn = document.getElementById("overviewBtn");
const materialsBtn = document.getElementById("materialsBtn");
const homeBtn = document.getElementById("homeBtn");

function nav(which) {
  overviewBtn.classList.toggle("active", which === "overview");
  materialsBtn.classList.toggle("active", which === "materials");
}

function home() {
  nav("overview");
  let html = `
    <section class="card hero">
      <span class="pill">Praxis-Spickzettel</span>
      <h2>Was brauche ich? Was mache ich?</h2>
      <p>Direkte Arbeitshilfe für die Durchführung – ohne Eingaben oder Speicherung.</p>
    </section>
    <h3 class="phase">Einführung · Rituale & Gruppengefühl</h3>
    <section class="card">`;
  lessons.forEach(l => {
    if (l.n === 4) {
      html += `</section><h3 class="phase">Phase 1 · Was ist passiert? – Aufmerksamkeit & Wahrnehmung</h3><section class="card">`;
    }
    if (l.n === 10) {
      html += `</section><h3 class="phase">Phase 2–4 · Inhalte folgen später</h3><section class="card">`;
    }
    html += `<div class="lesson">
      <div class="num">${l.n}</div>
      <div><b>${l.title}</b>
        ${l.goals ? `<div>${l.goals.map(g => `<span class="tag">${g}</span>`).join("")}</div>` : `<div class="muted">noch nicht eingepflegt</div>`}
      </div>
      ${l.n <= 9 ? `<button class="open" data-open="${l.n}">Öffnen</button>` : ""}
    </div>`;
  });
  html += `</section>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => lesson(Number(b.dataset.open))));
}

function lesson(n) {
  nav("overview");
  const l = lessons.find(x => x.n === n);
  if (!l || !l.materials) return home();
  app.innerHTML = `
    <button class="back" id="backBtn">← Übersicht</button>
    <section class="card hero">
      <span class="pill">Stunde ${l.n}</span>
      <h2>${l.title}</h2>
      <div>${l.goals.map(g => `<span class="tag">${g}</span>`).join("")}</div>
    </section>
    <section class="card"><h3>🎵 Direktmaterial</h3>
      <div class="mini" style="margin-bottom:8px"><b>Lubo-Hallo-Lied</b> – direkt abspielen</div>
      <audio controls preload="none" style="width:100%"><source src="material/lubo-hallo.mp3" type="audio/mpeg"></audio>
      ${l.n === 3 ? `<div style="margin-top:12px"><b>Emotionsbilder</b><div class="muted">Die sechs Bilder sind im Materialordner enthalten.</div></div>` : ""}
      ${l.n === 4 ? `<div style="margin-top:12px"><a class="primary" href="material/deckblatt-lubo-mappen.jpg" target="_blank" style="display:inline-block;text-decoration:none">📄 Mappen-Deckblatt öffnen</a></div>` : ""}
    </section>
    <section class="card"><h3>🧰 Das brauche ich</h3>${l.materials.map(x => `<div class="material">• ${x}</div>`).join("")}</section>
    <section class="card"><h3>🛠️ Vorher vorbereiten</h3>${l.prep.map(x => `<div class="material">• ${x}</div>`).join("")}</section>
    <section class="card"><h3>▶️ So geht’s</h3>
      ${l.steps.map((s,i) => `<div class="step" data-step="${i+1}"><b>${s[0]}</b><p>${s[1]}</p><div class="mini"><b>Material:</b> ${s[2]}</div></div>`).join("")}
    </section>
    ${l.note ? `<section class="card note"><b>Praxishinweis</b><p>${l.note}</p></section>` : ""}
  `;
  document.getElementById("backBtn").addEventListener("click", home);
}

function materials() {
  nav("materials");
  const first = lessons.slice(0,9);
  app.innerHTML = `
    <section class="card hero"><span class="pill">Vorbereitung</span><h2>Materialübersicht · Stunden 1–9</h2></section>
    <div class="grid">
    ${first.map(l => `<section class="card"><h3>${l.n}. ${l.title}</h3>${l.materials.map(x => `<div class="material">• ${x}</div>`).join("")}<button class="primary" data-mat="${l.n}" style="margin-top:12px">Stunde öffnen</button></section>`).join("")}
    </div>`;
  app.querySelectorAll("[data-mat]").forEach(b => b.addEventListener("click", () => lesson(Number(b.dataset.mat))));
}

overviewBtn.addEventListener("click", home);
materialsBtn.addEventListener("click", materials);
homeBtn.addEventListener("click", home);
home();
</script>
</body>
</html>
