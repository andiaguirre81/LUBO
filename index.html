<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ef7f23">
<title>Lubo – Praxisbegleiter</title>
<style>:root{--orange:#ef7f23;--orange2:#f7a04a;--violet:#514a91;--green:#4e7449;--cream:#fff8ee;--ink:#302d2a;--soft:#fff0df;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}header{background:linear-gradient(135deg,var(--orange),var(--orange2));color:white;padding:16px max(18px,calc((100% - 980px)/2));display:flex;align-items:center;gap:14px}header h1{margin:1px 0;font-size:1.5rem}header small{opacity:.9}.homeIcon{width:52px;height:52px;border:0;border-radius:16px;background:var(--green);color:white;font-size:1.25rem;font-weight:900;position:relative;box-shadow:0 4px 12px #0002}.homeIcon span{position:absolute;right:7px;top:3px;color:#ffd45a;font-size:1.2rem}button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}nav{position:sticky;top:0;background:#fff;padding:9px;display:flex;gap:8px;justify-content:center;box-shadow:0 2px 8px #0001;z-index:2}nav button.active{background:var(--violet);color:white}main{max-width:980px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #0000000d}.hero{background:linear-gradient(135deg,var(--soft),#fff);border-top:6px solid var(--orange)}.hero h2{margin:8px 0}.intro{font-size:1.05rem}.phase{color:var(--violet);margin:22px 0 8px}.lesson{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #eee}.lesson:first-child{border:0}.lesson.locked{opacity:.55}.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:850}.lesson button,.primary{background:var(--violet);color:#fff}.tag{display:inline-block;background:#f0eefb;color:#413a7b;border-radius:999px;padding:5px 9px;margin:4px 4px 0 0;font-size:.8rem}.pill{display:inline-block;background:var(--violet);color:white;border-radius:999px;padding:5px 10px;font-size:.8rem}.sectionTitle{display:flex;align-items:center;gap:9px;margin:0 0 12px}.sectionTitle i{font-style:normal;font-size:1.35rem}.material{padding:8px 0;border-bottom:1px solid #eee}.material:last-child{border:0}.step{position:relative;padding:14px 14px 14px 54px;background:#fffaf4;border-radius:14px;margin:10px 0;border:1px solid #f6e2cb}.step:before{content:attr(data-n);position:absolute;left:14px;top:13px;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800}.step b{color:var(--violet)}.step p{margin:5px 0 0;line-height:1.45}.miniMaterial{font-size:.83rem;color:#6c6259;margin-top:7px}.note{border-left:5px solid var(--green);background:#f7fbf6}.back{background:#eee8df;color:var(--ink);margin-bottom:12px}.muted{color:#756d66;font-size:.92rem}.materialsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.materialsGrid .card{margin:0}@media(max-width:600px){header h1{font-size:1.25rem}.lesson{grid-template-columns:42px 1fr}.lesson button{grid-column:2}.card{padding:15px}main{padding:13px}.homeIcon{width:46px;height:46px}}
</style>
</head>
<body>
<header>
  <button class="homeIcon" onclick="home()" aria-label="Startseite"><span>?</span>⌂</button>
  <div><small>Interne Arbeitshilfe · Vorschulprogramm</small><h1>Lubo – Praxisbegleiter</h1></div>
</header>
<nav>
  <button data-view="home" class="active">Übersicht</button>
  <button data-view="materials">Material 1–3</button>
</nav>
<main id="app"></main>
<script>const lessons=[
{n:1,title:'Hier kommt Lubo aus dem All!',goals:['Förderprogramm kennenlernen','Gruppenregeln'],materials:['Handpuppe „Lubo“','Bild von Lubo im Raumschiff','Kleiner Ball','Regelkarten + kleiner Beutel','Lebhaftes Lied + Abspielgerät','Schönes Tuch für die Kreismitte'],prep:['Umgang mit der Handpuppe kurz ausprobieren','Stuhlkreis/Kreismitte vorbereiten','Lubo zunächst außerhalb des Raums aufbewahren'],steps:[['Begrüßung & Lubo vorstellen','Lubo als Besucher aus dem All einführen. Er möchte von den Kindern lernen, wie man auf der Erde gut miteinander umgeht.','Handpuppe, Lubo-Bild'],['Namensspiel mit Ball','Ball im Kreis zurollen, Blickkontakt aufnehmen und den eigenen Namen sagen. In einer zweiten Runde kann der Name des Kindes genannt werden, zu dem der Ball rollt.','Ball'],['Gruppenregeln','Regelkarten gemeinsam anschauen, die dargestellten Regeln mit den Kindern formulieren und anschließend sichtbar im Raum lassen.','Regelkarten'],['Kooperationsspiel „Eisscholle“','Die Gruppe muss auf einer immer kleiner werdenden Fläche zusammenrücken. Gemeinsam Lösungen finden, damit alle Platz haben.','Tuch / Spielfläche'],['Abschlussritual','Gemeinsam aufstehen, Hände zur Mitte und dreimal verabschieden.','–']]},
{n:2,title:'Zusammen sind wir eine Gruppe!',goals:['Gruppengefühl stärken','Sternenrunde einführen'],materials:['Handpuppe „Lubo“','Regelkarten','Tuch für die Kreismitte','Musik + Abspielgerät','Sternenaufkleber','Farbiges Tonpapier','Dunkelblauer Fotokarton','Fotogerät'],prep:['Fotokarton und Bastelmaterial bereitlegen','Eigenes Handmuster als Beispiel vorbereiten','Raum/Kreismitte gestalten und Gruppenregeln sichtbar aufhängen','Lubo-Lied bereithalten'],steps:[['Begrüßung','Lubo-Lied und kurze Wiederholung der Gruppenregeln. Gemeinsam einen Gruppennamen festlegen.','Lubo, Lied, Regelkarten'],['Namensspiel „Mein rechter, rechter Platz ist frei“','Im Stuhlkreis bleibt ein Platz frei. Das Kind daneben wünscht ein anderes Kind auf den freien Platz; Namen werden wiederholt.','Stuhlkreis'],['Gruppenbild gestalten','Jedes Kind gestaltet einen Handumriss. Die Hände werden gemeinsam als Gruppenbild angeordnet und mit Namen versehen.','Tonpapier, Fotokarton, Bastelmaterial'],['Sternenrunde','Lubo hebt bei jedem Kind konkret etwas Positives aus der Stunde hervor. Das Kind erhält einen Stern.','Sternenaufkleber'],['Gruppenfoto','Ein Foto der Gruppe für das Gruppenbild aufnehmen.','Fotogerät'],['Abschlussritual','Gemeinsamer Abschluss wie in Stunde 1.','–']]},
{n:3,title:'Lubo und die Kinder machen einen Wetterbericht',goals:['Stimmungsbarometer einführen','Gefühle erkennen & benennen'],materials:['Handpuppe „Lubo“','Emotionsbilder von Lubo','Emotionsbilder von Kindern','Fragezeichen-Karte','Bilder/Fotos: Sonne, Regen, Gewitter, Nebel','Tücher: gelb, blau, weiß, grau','Bild „Lubo mit Herz“','Sternenaufkleber'],prep:['Vier Wetterecken im Raum vorbereiten: Sonne, Regen, Gewitter/Sturm und Nebel','Passende Tücher, Wetter- und Emotionsbilder bereitlegen'],steps:[['Begrüßung','Lubo-Lied; bei Bedarf Gruppenregeln kurz wiederholen.','Lubo, Lied'],['„Markt der Gefühle“','Kinder bewegen sich durch den Raum und stellen verschiedene Gefühlslagen körperlich dar, z. B. fröhlich, traurig/müde, selbstbewusst, ängstlich oder wütend.','Freie Bewegungsfläche'],['Gefühlswetter einführen','Gemeinsam Gefühle mit Wetterlagen vergleichen und zuordnen. Unterschiedliche Zuordnungen sind ausdrücklich möglich.','Emotionsbilder, Wetterbilder, Tücher'],['Eigener Wetterbericht','Jedes Kind überlegt: „Welches Wetter ist gerade in mir?“ und stellt sich in die passende Wetterecke. Wer möchte, erklärt kurz warum.','Vorbereitete Wetterecken'],['Sternenrunde','Lubo benennt bei jedem Kind etwas Positives aus der Stunde und vergibt einen Stern.','Sternenaufkleber'],['Abschlussritual','Gemeinsamer Abschluss wie in Stunde 1.','–']]}
];
const titles=['Wir lernen uns besser kennen','Das kann ich gut!','Auf dem nebligen See','Wer ist alles in der Sternengruppe?','Wir sind die Detektive der Sternengruppe','Wir sind eine Gruppe und halten zusammen!','Mein Körper verrät mir, wie es mir geht!','Lubo freut sich über seine neuen Freunde','Lubo hat Heimweh','Lubo hat Ärger bekommen','Lubo hat Angst','Lubos mutige Freunde','Lubo und die Gefühlsdetektive','Wie würdest du dich fühlen?','Eine Busfahrt mit viel Gefühl','Die Sternengruppe wird gebraucht','Ich fühle mich wohl!','Lubos Raumschiff ist weg!','Lubo darf nicht mitspielen','Lubo wird gehänselt','Lubo kann ganz ruhig bleiben','Zusammen können wir vieles lösen','Lubo verliert ein Spiel','Lubo lernt, mit Enttäuschungen umzugehen','Wir können gut zusammenarbeiten!','Lubo löst einen Streit','Sternenfahrt','Lubo möchte gerne mitmachen!','Lubo hat gelernt, wie man gut miteinander umgeht','Lubos neues Raumschiff','Auf Wiedersehen!'];titles.forEach((t,i)=>lessons.push({n:i+4,title:t}));
function shell(h){document.querySelector('#app').innerHTML=h}function nav(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function home(){nav('home');let h=`<section class="card hero"><span class="pill">Praxis-Spickzettel</span><h2>Was brauche ich? Was mache ich?</h2><p class="intro">Schlanke interne Arbeitshilfe für die Durchführung. Keine Eingaben, keine Dokumentation – Stunde öffnen und loslegen.</p></section><h3 class="phase">Einführung · Rituale & Gruppengefühl</h3><section class="card">`;lessons.forEach(l=>{h+=`<div class="lesson ${l.n>3?'locked':''}"><div class="num">${l.n}</div><div><b>${l.title}</b>${l.goals?`<div>${l.goals.map(g=>`<span class="tag">${g}</span>`).join('')}</div>`:'<div class="muted">noch nicht eingepflegt</div>'}</div>${l.n<=3?`<button onclick="lesson(${l.n})">Öffnen</button>`:''}</div>`;if(l.n===3)h+=`</section><h3 class="phase">Weitere Stunden · bereits als Übersicht angelegt</h3><section class="card">`;}h+='</section>';shell(h)}
function lesson(n){nav('home');let l=lessons[n-1];shell(`<button class="back" onclick="home()">← Übersicht</button><section class="card hero"><span class="pill">Stunde ${n}</span><h2>${l.title}</h2>${l.goals.map(g=>`<span class="tag">${g}</span>`).join('')}</section><section class="card"><h3 class="sectionTitle"><i>🧰</i> Das brauche ich</h3>${l.materials.map(x=>`<div class="material">• ${x}</div>`).join('')}</section><section class="card"><h3 class="sectionTitle"><i>🛠️</i> Vorher vorbereiten</h3>${l.prep.map(x=>`<div class="material">• ${x}</div>`).join('')}</section><section class="card"><h3 class="sectionTitle"><i>▶️</i> So geht's</h3>${l.steps.map((s,i)=>`<div class="step" data-n="${i+1}"><b>${s[0]}</b><p>${s[1]}</p><div class="miniMaterial">Material: ${s[2]}</div></div>`).join('')}</section>${n===3?`<section class="card note"><b>Praxishinweis</b><p>Beim Gefühlswetter gibt es kein „richtig“ oder „falsch“. Die Kinder entscheiden selbst, welches Wetter zu ihrer momentanen Stimmung passt.</p></section>`:''}`)}
function materials(){nav('materials');shell(`<section class="card hero"><span class="pill">Vorbereitung</span><h2>Materialübersicht · Stunden 1–3</h2><p>Zum schnellen Bereitlegen vor den ersten drei Einheiten.</p></section><div class="materialsGrid">${lessons.slice(0,3).map(l=>`<section class="card"><h3>${l.n}. ${l.title}</h3>${l.materials.map(x=>`<div class="material">• ${x}</div>`).join('')}<button class="primary" onclick="lesson(${l.n})">Stunde öffnen</button></section>`).join('')}</div>`)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>({home,materials}[b.dataset.view])());home();
</script>
</body>
</html>
